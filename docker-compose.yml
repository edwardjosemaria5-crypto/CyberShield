# CyberShield — production composition (backend + frontend).
#
#   docker compose up --build
#   open http://localhost
#
# Persistence: SQLite is stored in ./data/cybershield.db on the host.
# Secrets: pass a real .env to the backend via `env_file` (optional), or
#       set environment variables in your shell before `docker compose up`.

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CYBERSHIELD_DATABASE_URL=sqlite:////app/data/cybershield.db
      - CYBERSHIELD_CORS_ORIGINS=http://localhost
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend