# CyberShield frontend — nginx server block (replaces the image default).
#
# The app is a React Router SPA (BrowserRouter): routes live in the URL
# (/scan, /dashboard, /history, /report/<scan-id>, /settings) but exist only
# as client-side paths. Without a fallback, a direct navigation or browser
# refresh on those routes hits nginx with a path that has no file and the
# stock default config answers 404. `try_files ... /index.html` hands any
# non-file path to the SPA entry point so React Router can render the route.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Global response security headers (every response, incl. errors) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Minimal CSP matching the actual SPA: Vite emits same-origin /assets/
    # script+style files, no inline scripts, no external CDNs/fonts, and the
    # app calls only the CyberShield backend. 'unsafe-inline' for style is
    # required because React renders inline style ATTRIBUTES (width/color);
    # script-src stays strictly 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000; frame-ancestors 'self'" always;

    # Hashed production bundles (vite emits content-hashed names under
    # /assets/) are immutable: cache them long-term. Real assets keep
    # resolving directly; a genuinely missing asset is still a 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;

        # This block declares its own add_header, so the server-level security
        # headers are NOT inherited here (nginx inheritance rule) — they must be
        # repeated to keep every response, including assets, secured.
        # `expires 1y` already emits Cache-Control: max-age=31536000, so no
        # second Cache-Control add_header here (that would produce a duplicate
        # header that silently drops "immutable").
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000; frame-ancestors 'self'" always;
    }

    # SPA history fallback: paths with no matching file resolve to the app
    # entry point instead of a 404, letting React Router handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}