name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Dependency health (pip check)
        run: python -m pip check
      - name: Backend test suite
        run: python -m pytest -q

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Frontend test suite
        run: npm test

  docker:
    name: Docker Compose (release-boundary contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Assert loopback-only publication and SQLite persistence
        run: |
          docker compose config --format json > /tmp/cybershield-compose.json
          python3 - <<'PY'
          import json
          import sys

          with open("/tmp/cybershield-compose.json", encoding="utf-8-sig") as fh:
              config = json.load(fh)

          services = config["services"]
          problems = []

          expected_ports = {
              "backend": ("8000", 8000),
              "frontend": ("80", 80),
          }
          for name, (published, target) in expected_ports.items():
              ports = [
                  p for p in services[name].get("ports", [])
                  if str(p.get("published")) == published
              ]
              if not ports:
                  problems.append(f"{name}: published port {published} is missing")
                  continue
              for port in ports:
                  if port.get("host_ip") != "127.0.0.1":
                      problems.append(
                          f"{name}: published:{published} bound to host_ip "
                          f"{port.get('host_ip')!r}; expected 127.0.0.1"
                      )
                  if str(port.get("target")) != str(target):
                      problems.append(
                          f"{name}: published:{published} targets container port "
                          f"{port.get('target')}; expected {target}"
                      )

          # Fail closed on ANY published port that is reachable beyond loopback.
          for name, service in services.items():
              for port in service.get("ports", []):
                  if port.get("host_ip") != "127.0.0.1":
                      problems.append(
                          f"{name}: published port is externally reachable "
                          f"(host_ip={port.get('host_ip')!r}); only 127.0.0.1 is allowed"
                      )

          environment = services["backend"].get("environment", {}) or {}
          db_url = environment.get("CYBERSHIELD_DATABASE_URL")
          if db_url != "sqlite:////app/data/cybershield.db":
              problems.append(
                  f"backend CYBERSHIELD_DATABASE_URL={db_url!r}; "
                  "expected sqlite:////app/data/cybershield.db"
              )

          volumes = services["backend"].get("volumes", [])
          if not any(
              v.get("type") == "bind" and v.get("target") == "/app/data"
              for v in volumes
          ):
              problems.append("backend has no bind mount to /app/data")

          if problems:
              print("Release-boundary assertions FAILED:")
              for problem in problems:
                  print(" -", problem)
              sys.exit(1)
          print("Loopback-only publication and SQLite persistence verified.")
          PY

  secret-scan:
    name: Secret scan (committed credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for high-signal secret patterns
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()

          patterns = [
              (re.compile(r"AKIA[0-9A-Z]{16}"), "AWS access key ID"),
              (re.compile(r"AIza[0-9A-Za-z_-]{35}"), "Google API key"),
              (re.compile(r"ghp_[A-Za-z0-9]{36}"), "GitHub personal access token"),
              (re.compile(r"sk-[A-Za-z0-9]{20,}"), "OpenAI-style secret key"),
              (re.compile(r"xox[baprs]-[0-9A-Za-z-]{10,}"), "Slack token"),
              (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"), "private key"),
          ]

          # Deliberate test fixtures are exempt; real credentials never carry these markers.
          PLACEHOLDER_HINTS = (
              "must-not-leak",
              "changeme",
              "placeholder",
              "replace-me",
              "skeleton",
              "put-your-key",
          )

          problems = []
          for path in files:
              try:
                  with open(path, encoding="utf-8", errors="ignore") as fh:
                      content = fh.read()
              except OSError:
                  continue
              for regex, label in patterns:
                  for match in regex.finditer(content):
                      start = max(0, match.start() - 80)
                      end = min(len(content), match.end() + 80)
                      window = content[start:end]
                      if any(hint in window for hint in PLACEHOLDER_HINTS):
                          continue
                      problems.append(f"{path} -> {label}")

          if problems:
              print("Committed secret-like values detected:")
              for problem in problems:
                  print(" -", problem)
              sys.exit(1)
          print("Secret scan: no committed credentials detected.")
          PY